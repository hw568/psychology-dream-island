<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="psiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b2361"/>
      <stop offset="100%" stop-color="#1e1236"/>
    </linearGradient>
    <linearGradient id="psiGold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <radialGradient id="mindGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b2361" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Rounded Shield Base -->
  <rect width="64" height="64" rx="18" fill="url(#psiBg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="16.5" fill="none" stroke="#d97706" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- Mind Glow -->
  <circle cx="32" cy="24" r="22" fill="url(#mindGlow)"/>
  <!-- Neural / Waveform Arc -->
  <path d="M14 36c4-7 11-11 18-11s14 4 18 11" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.65"/>
  <!-- Psychology Symbol: Greek Letter Psi (Ψ) -->
  <!-- Base Pedestal -->
  <rect x="25" y="52" width="14" height="3" rx="1.5" fill="url(#psiGold)"/>
  <!-- Vertical Pillar Stem -->
  <path d="M30 15h4v38h-4z" fill="url(#psiGold)"/>
  <!-- Symmetrical Curved Arms -->
  <path d="M17 19c1 16 11 23 15 24v-4c-3-1-11-7-12-20h-3zm30 0c-1 16-11 23-15 24v-4c3-1 11-7 12-20h3z" fill="url(#psiGold)"/>
  <!-- Horizontal Crossbar Barbs -->
  <rect x="15" y="17" width="7" height="3" rx="1" fill="url(#psiGold)"/>
  <rect x="42" y="17" width="7" height="3" rx="1" fill="url(#psiGold)"/>
  <rect x="29" y="14" width="6" height="3" rx="1" fill="url(#psiGold)"/>
  <!-- Top Beacon of Awareness (Mind Spark) -->
  <circle cx="32" cy="11" r="3.2" fill="#ffffff"/>
  <circle cx="32" cy="11" r="5" fill="#fef08a" opacity="0.45"/>
  <circle cx="18.5" cy="15.5" r="1.6" fill="#67e8f9"/>
  <circle cx="45.5" cy="15.5" r="1.6" fill="#67e8f9"/>
</svg>
